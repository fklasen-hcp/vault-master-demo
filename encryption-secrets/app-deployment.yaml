apiVersion: v1
kind: Namespace
metadata:
  name: encryption-demo
---
# ConfigMap is created separately by Makefile from app-simple.py
# This ensures the latest version is always deployed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: encryption-demo-app
  namespace: encryption-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: encryption-demo
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: encryption-demo-secret-reader
  namespace: encryption-demo
subjects:
- kind: ServiceAccount
  name: encryption-demo-app
  namespace: encryption-demo
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encryption-demo-ui
  namespace: encryption-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: encryption-demo-ui
  template:
    metadata:
      labels:
        app: encryption-demo-ui
    spec:
      serviceAccountName: encryption-demo-app
      containers:
      - name: app
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install flask hvac psycopg2-binary faker
            cd /app && python app.py
        ports:
        - containerPort: 8080
        env:
        - name: VAULT_ADDR
          value: "https://host.minikube.internal:8200"
        - name: VAULT_NAMESPACE
          value: "master-demo"
        - name: VAULT_SKIP_VERIFY
          value: "true"
        volumeMounts:
        - name: app-code
          mountPath: /app
      volumes:
      - name: app-code
        configMap:
          name: encryption-app

