apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pki-demo-secret-reader
  namespace: pki-demo
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["pki-demo-tls"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pki-demo-secret-reader
  namespace: pki-demo
subjects:
- kind: ServiceAccount
  name: pki-demo-app
  namespace: pki-demo
roleRef:
  kind: Role
  name: pki-demo-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pki-demo-app
  namespace: pki-demo
  labels:
    app: pki-demo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pki-demo
  template:
    metadata:
      labels:
        app: pki-demo
      annotations:
        vault.hashicorp.com/agent-inject: "false"
    spec:
      serviceAccountName: pki-demo-app
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 443
          name: https
          protocol: TCP
        - containerPort: 80
          name: http
          protocol: TCP
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
      - name: cert-monitor
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            # Get certificate directly from Kubernetes secret (always up-to-date)
            CERT=$(kubectl get secret pki-demo-tls -n pki-demo -o jsonpath='{.data.certificate}' | base64 -d)
            if [ ! -z "$CERT" ]; then
              # Write to temp file first to avoid partial page loads
              cat > /usr/share/nginx/html/index.html.tmp << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Vault PKI Auto-Renewal</title>
              <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,">
              <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                      background: #000000;
                      color: #FFFFFF;
                      min-height: 100vh;
                      padding: 20px;
                      font-size: 16px;
                      line-height: 1.5;
                      position: relative;
                      zoom: 0.8;
                  }
                  body::before {
                      content: '';
                      position: fixed;
                      top: 50%;
                      left: -100px;
                      transform: translateY(-50%);
                      width: 600px;
                      height: 600px;
                      background-image: url('data:image/svg+xml;base64,');
                      background-repeat: no-repeat;
                      background-position: center;
                      background-size: contain;
                      opacity: 0.08;
                      pointer-events: none;
                      z-index: 0;
                  }
                  .header, .container {
                      position: relative;
                      z-index: 1;
                  }
                  .header {
                      background: #1a1a1a;
                      border: 2px solid #333333;
                      border-radius: 8px;
                      padding: 20px;
                      margin-bottom: 20px;
                      max-width: 1000px;
                      margin: 0 auto 20px auto;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                  }
                  .header h1 {
                      color: #FFFFFF;
                      font-size: 28px;
                      margin: 0;
                      font-weight: 700;
                      letter-spacing: -0.02em;
                      text-align: center;
                  }
                  .container {
                      max-width: 1000px;
                      margin: 0 auto;
                      background: #1a1a1a;
                      border: 2px solid #333333;
                      border-radius: 8px;
                      padding: 40px;
                  }
                  .status {
                      font-size: 20px;
                      font-weight: 600;
                      text-align: center;
                      padding: 20px;
                      margin: 25px 0;
                      border-radius: 6px;
                      background: rgba(255, 216, 20, 0.1);
                      color: #FFD814;
                      border: 2px solid #FFD814;
                  }
                  .info-box {
                      background: #0a0a0a;
                      border: 2px solid #333333;
                      padding: 20px;
                      margin: 20px 0;
                      border-radius: 6px;
                  }
                  .info-box:hover {
                      border-color: #FFD814;
                      box-shadow: 0 0 15px rgba(255, 216, 20, 0.1);
                  }
                  .label {
                      font-weight: 600;
                      color: #FFD814;
                      font-size: 12px;
                      margin-bottom: 10px;
                      text-transform: uppercase;
                      letter-spacing: 0.05em;
                  }
                  .value {
                      color: #FFFFFF;
                      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
                      font-size: 13px;
                      word-break: break-all;
                      line-height: 1.6;
                      background: #000000;
                      padding: 12px;
                      border-radius: 4px;
                      border: 1px solid #333333;
                      font-weight: 400;
                  }
                  .refresh-btn {
                      display: block;
                      margin: 30px auto;
                      padding: 16px 48px;
                      font-size: 15px;
                      font-weight: 600;
                      color: #000000;
                      background: #FFD814;
                      border: none;
                      border-radius: 6px;
                      cursor: pointer;
                      transition: all 0.2s;
                      font-family: 'Inter', sans-serif;
                  }
                  .refresh-btn:hover {
                      background: #FFC700;
                      transform: translateY(-2px);
                      box-shadow: 0 6px 20px rgba(255, 216, 20, 0.4);
                  }
                  .refresh-btn:active {
                      transform: translateY(0);
                  }
                  .footer {
                      text-align: center;
                      color: #888888;
                      margin-top: 40px;
                      padding-top: 20px;
                      border-top: 1px solid #333333;
                      font-size: 14px;
                      line-height: 1.8;
                      font-weight: 400;
                  }
                  .footer p {
                      margin: 8px 0;
                  }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>Vault PKI Certificate Auto-Renewal</h1>
              </div>
              <div class="container">
          EOF
              
              # Add certificate details from the secret we just fetched
              echo '<div class="info-box"><div class="label">Certificate Subject:</div><div class="value">' >> /usr/share/nginx/html/index.html.tmp
              echo "$CERT" | openssl x509 -noout -subject 2>/dev/null | sed 's/subject=//' >> /usr/share/nginx/html/index.html.tmp
              echo '</div></div>' >> /usr/share/nginx/html/index.html.tmp
              
              echo '<div class="info-box"><div class="label">Serial Number:</div><div class="value">' >> /usr/share/nginx/html/index.html.tmp
              echo "$CERT" | openssl x509 -noout -serial 2>/dev/null | sed 's/serial=//' >> /usr/share/nginx/html/index.html.tmp
              echo '</div></div>' >> /usr/share/nginx/html/index.html.tmp
              
              echo '<div class="info-box"><div class="label">Valid From:</div><div class="value">' >> /usr/share/nginx/html/index.html.tmp
              echo "$CERT" | openssl x509 -noout -startdate 2>/dev/null | sed 's/notBefore=//' >> /usr/share/nginx/html/index.html.tmp
              echo '</div></div>' >> /usr/share/nginx/html/index.html.tmp
              
              echo '<div class="info-box"><div class="label">Valid Until:</div><div class="value">' >> /usr/share/nginx/html/index.html.tmp
              echo "$CERT" | openssl x509 -noout -enddate 2>/dev/null | sed 's/notAfter=//' >> /usr/share/nginx/html/index.html.tmp
              echo '</div></div>' >> /usr/share/nginx/html/index.html.tmp
              
              echo '<div class="info-box"><div class="label">Issuer:</div><div class="value">' >> /usr/share/nginx/html/index.html.tmp
              echo "$CERT" | openssl x509 -noout -issuer 2>/dev/null | sed 's/issuer=//' >> /usr/share/nginx/html/index.html.tmp
              echo '</div></div>' >> /usr/share/nginx/html/index.html.tmp
              
              echo '<div class="info-box"><div class="label">Pod Name:</div><div class="value">' >> /usr/share/nginx/html/index.html.tmp
              echo "$HOSTNAME" >> /usr/share/nginx/html/index.html.tmp
              echo '</div></div>' >> /usr/share/nginx/html/index.html.tmp
              
              echo '<div class="info-box"><div class="label">Current Time:</div><div class="value">' >> /usr/share/nginx/html/index.html.tmp
              date '+%Y-%m-%d %H:%M:%S %Z' >> /usr/share/nginx/html/index.html.tmp
              echo '</div></div>' >> /usr/share/nginx/html/index.html.tmp
              
              cat >> /usr/share/nginx/html/index.html.tmp << 'EOF'
                  <button class="refresh-btn" onclick="location.reload()">Refresh Certificate Info</button>
                  <div class="footer">
                      <p>Certificate Validity: 30 seconds | VSO Renewal: Every ~25 seconds</p>
                      <p>Click refresh to see updated certificate info after renewal</p>
                      <p>VSO updates the Kubernetes secret automatically - watch the serial number change!</p>
                  </div>
              </div>
          </body>
          </html>
          EOF
              # Atomically move temp file to final location
              mv /usr/share/nginx/html/index.html.tmp /usr/share/nginx/html/index.html
            else
              echo "<h1>Waiting for certificate...</h1>" > /usr/share/nginx/html/index.html
            fi
            sleep 3
          done
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: tls-certs
        secret:
          secretName: pki-demo-tls
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: html
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: pki-demo
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
    
    server {
        listen 443 ssl;
        server_name _;
        
        ssl_certificate /etc/nginx/ssl/certificate;
        ssl_certificate_key /etc/nginx/ssl/private_key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pki-demo-app
  namespace: pki-demo

