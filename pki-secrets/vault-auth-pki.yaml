apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: pki-auth
  namespace: pki-demo
spec:
  namespace: master-demo
  method: kubernetes
  mount: master-demo-auth
  kubernetes:
    role: master-demo-pki-cert-issuer
    serviceAccount: pki-demo-app
    audiences:
      - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pki-demo-app
  namespace: pki-demo

