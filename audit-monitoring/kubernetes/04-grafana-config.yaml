apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: audit-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "10s"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: audit-monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Vault Audit'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vault-audit
  namespace: audit-monitoring
data:
  vault-audit-dashboard.json: |
    {
      "title": "Vault Audit Monitoring",
        "tags": ["vault", "audit", "security"],
        "timezone": "browser",
        "schemaVersion": 38,
        "version": 1,
        "refresh": "5s",
        "time": {
          "from": "now-15m",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Total Requests (Last 15min)",
            "type": "stat",
            "gridPos": {"h": 4, "w": 8, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum(increase(vault_audit_requests_total[15m]))",
                "refId": "A"
              }
            ],
            "options": {
              "graphMode": "area",
              "colorMode": "value",
              "textMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0
              }
            }
          },
          {
            "id": 3,
            "title": "Active Operations (req/min)",
            "type": "stat",
            "gridPos": {"h": 4, "w": 8, "x": 8, "y": 0},
            "targets": [
              {
                "expr": "sum(rate(vault_audit_requests_total[1m]) * 60)",
                "refId": "A"
              }
            ],
            "options": {
              "graphMode": "area",
              "colorMode": "value",
              "textMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqpm",
                "decimals": 1
              }
            }
          },
          {
            "id": 4,
            "title": "Unique Clients",
            "type": "stat",
            "gridPos": {"h": 4, "w": 8, "x": 16, "y": 0},
            "targets": [
              {
                "expr": "count(count by (display_name) (vault_audit_auth_requests_total))",
                "refId": "A"
              }
            ],
            "options": {
              "graphMode": "none",
              "colorMode": "value",
              "textMode": "value"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0
              }
            }
          },
          {
            "id": 5,
            "title": "Requests Over Time",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "sum by (operation) (rate(vault_audit_requests_total[1m]))",
                "refId": "A",
                "legendFormat": "{{operation}}"
              }
            ],
            "options": {
              "tooltip": {"mode": "multi"},
              "legend": {"displayMode": "list", "placement": "bottom"}
            },
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "smooth",
                  "fillOpacity": 20,
                  "stacking": {"mode": "normal"}
                },
                "unit": "reqps"
              }
            }
          },
          {
            "id": 6,
            "title": "Requests by Mount Type",
            "type": "piechart",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "sum by (mount_type) (increase(vault_audit_requests_total[15m]))",
                "refId": "A",
                "legendFormat": "{{mount_type}}"
              }
            ],
            "options": {
              "legend": {"displayMode": "table", "placement": "right", "values": ["value", "percent"]},
              "pieType": "donut"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              }
            }
          },
          {
            "id": 7,
            "title": "Operations by Type",
            "type": "bargauge",
            "gridPos": {"h": 6, "w": 12, "x": 0, "y": 12},
            "targets": [
              {
                "expr": "sum by (operation) (increase(vault_audit_requests_total[15m]))",
                "refId": "A",
                "legendFormat": "{{operation}}"
              }
            ],
            "options": {
              "orientation": "horizontal",
              "displayMode": "gradient",
              "showUnfilled": true
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "min": 0
              }
            }
          },
          {
            "id": 8,
            "title": "Top 10 Paths",
            "type": "table",
            "gridPos": {"h": 6, "w": 12, "x": 12, "y": 12},
            "targets": [
              {
                "expr": "topk(10, sum by (path) (increase(vault_audit_requests_total[15m])))",
                "refId": "A",
                "format": "table",
                "instant": true
              }
            ],
            "options": {
              "showHeader": true
            },
            "fieldConfig": {
              "defaults": {
                "custom": {"align": "auto"}
              }
            }
          },
          {
            "id": 9,
            "title": "Authentication Activity",
            "type": "timeseries",
            "gridPos": {"h": 6, "w": 12, "x": 0, "y": 18},
            "targets": [
              {
                "expr": "sum by (auth_method) (rate(vault_audit_auth_requests_total{auth_method!=\"unknown\"}[1m]))",
                "refId": "A",
                "legendFormat": "{{auth_method}}"
              }
            ],
            "options": {
              "tooltip": {"mode": "multi"},
              "legend": {"displayMode": "list", "placement": "bottom"}
            },
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "smooth",
                  "fillOpacity": 10
                },
                "unit": "reqps"
              },
              "overrides": [
                {
                  "matcher": {"id": "byName", "options": "root"},
                  "properties": [
                    {
                      "id": "color",
                      "value": {"mode": "fixed", "fixedColor": "red"}
                    }
                  ]
                }
              ]
            }
          },
          {
            "id": 10,
            "title": "Errors and Warnings",
            "type": "timeseries",
            "gridPos": {"h": 6, "w": 12, "x": 12, "y": 18},
            "targets": [
              {
                "expr": "sum(rate(vault_audit_errors_total[1m]))",
                "refId": "A",
                "legendFormat": "Errors"
              },
              {
                "expr": "sum(rate(vault_audit_warnings_total[1m]))",
                "refId": "B",
                "legendFormat": "Warnings"
              }
            ],
            "options": {
              "tooltip": {"mode": "multi"},
              "legend": {"displayMode": "list", "placement": "bottom"}
            },
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "smooth",
                  "fillOpacity": 10
                },
                "unit": "reqps"
              }
            }
          }
        ]
    }

