# Logrotate configuration for Vault audit log
# Place this file in /etc/logrotate.d/ on the Vault server
#
# IMPORTANT: Update the file path and user/group to match your environment

~/audit.log {
    # Rotate when file reaches 100MB
    size 100M
    
    # Keep 10 rotated log files
    rotate 10
    
    # Compress rotated files (except the most recent one)
    compress
    delaycompress
    
    # Don't error if log file is missing
    missingok
    
    # Don't rotate if file is empty
    notifempty
    
    # Create new log file with these permissions
    # Update user:group to match your environment
    create 0640 $USER staff
    
    # Use date as suffix for rotated files
    dateext
    dateformat -%Y%m%d-%s
    
    # Run this after rotation
    postrotate
        # Signal Vault to reopen the log file
        # This ensures Vault starts writing to the new file
        pkill -HUP vault 2>/dev/null || true
    endscript
}

# To enable this configuration:
# 1. Update the file path and user:group above to match your environment
# 2. Copy this file to /etc/logrotate.d/vault-audit:
#    sudo cp audit-monitoring/logrotate-vault-audit.conf /etc/logrotate.d/vault-audit
# 3. Test the configuration:
#    sudo logrotate -d /etc/logrotate.d/vault-audit
# 4. Force a rotation (for testing):
#    sudo logrotate -f /etc/logrotate.d/vault-audit
#
# Logrotate typically runs daily via cron
