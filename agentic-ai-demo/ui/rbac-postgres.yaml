apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-pod-reader
  namespace: postgres
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-ui-postgres-reader
  namespace: postgres
subjects:
- kind: ServiceAccount
  name: agentic-ui
  namespace: agentic-demo
roleRef:
  kind: Role
  name: postgres-pod-reader
  apiGroup: rbac.authorization.k8s.io

